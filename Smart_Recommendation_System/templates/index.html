<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IntelliRecommend</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="overlay"></div>

    <div class="container">

        <h1>IntelliRecommend</h1>

        <p class="subtitle">
            AI-Powered Recommendation Engine
        </p>

        <form method="POST">

            <input
                type="text"
                name="interests"
                placeholder="Enter interests like AI, books, football..."
                required
            >

            <button type="submit">
                Get Recommendations
            </button>

        </form>

        {% if recommendations %}

        <div class="results">

            {% for item in recommendations %}

            <div class="card">

                <h2>{{ item.title }}</h2>

                <p>
                    Category:
                    <span>{{ item.category }}</span>
                </p>

                <p>
                    Rating:
                    ⭐ {{ item.rating }}
                </p>

                <p>
                    AI Match:
                    <span class="confidence">
                        {{ item.confidence }}%
                    </span>
                </p>

                <p>
                    Matched Keywords:
                    {{ item.matched | join(', ') }}
                </p>

            </div>

            {% endfor %}

        </div>

        {% endif %}

    </div>

</body>

</html>
