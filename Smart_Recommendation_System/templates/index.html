<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Recommendation System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>AI Recommendation System</h1>

        <form method="POST">

            <input
                type="text"
                name="interests"
                placeholder="Enter your interests..."
                required
            >

            <button type="submit">
                Recommend
            </button>

        </form>

        {% if recommendations %}

        <div class="results">

            <h2>Recommendations</h2>

            <ul>

                {% for item in recommendations %}

                    <li>{{ item }}</li>

                {% endfor %}

            </ul>

        </div>

        {% endif %}

    </div>

</body>

</html>
